name: Hello

on:
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Echo hello
        run: echo "hello"

      - name: Show current directory
        run: pwd

      - name: List files and folders
        run: |
          echo "--- ls -la ---"
          ls -la

          echo "--- directories ---"
          find . -maxdepth 1 -type d | sort
